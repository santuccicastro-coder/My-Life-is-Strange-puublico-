name: Build Android APK (DuoFin)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies, verify quality & build web bundle
        run: |
          npm ci --legacy-peer-deps
          npm run lint
          npm test
          npm run lint:rules
          npm run build

      - name: Initialize Capacitor Android project & compile APK
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "DuoFin" "app.duofin.finance" --web-dir dist
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload DuoFin APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: duofin-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
